syntax = "proto3";

import "txn.proto";

package zera_wallets;

option optimize_for = SPEED;

message MaxSupply{
	string max_supply = 1;
	string circulation = 2;
	repeated zera_txn.MaxSupplyRelease release = 3;
}

message DerivedWallets
{
	map<string, bool> wallets = 1; // key = base58-encoded wallet address, value = smart contract store key
}